name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clare_ci
          POSTGRES_USER: clare_ci
          POSTGRES_PASSWORD: clare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clare_ci -d clare_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend tooling
        run: npm ci

      - name: Build and verify CSS
        run: |
          npm run build:css
          git diff --exit-code -- src/main/resources/static/css/site.css

      - name: Audit frontend dependencies and JavaScript syntax
        run: |
          npm audit --audit-level=high
          node --check src/main/resources/static/js/site.js

      - name: Validate YAML and whitespace
        run: |
          npx --yes yaml-lint src/main/resources/application.yml render.yaml .github/workflows/quality.yml
          git diff --check

      - name: Run Java tests and package the application
        run: ./mvnw package

      - name: Start the packaged application
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/clare_ci
          SPRING_DATASOURCE_USERNAME: clare_ci
          SPRING_DATASOURCE_PASSWORD: clare_ci
          FLYWAY_BASELINE_ON_MIGRATE: "false"
        run: |
          java -jar target/clare-ceremonies-site-0.0.1-SNAPSHOT.jar > application.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8081/actuator/health/readiness > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat application.log
          exit 1

      - name: Verify probes, routes and response headers
        run: |
          curl --fail --silent http://localhost:8081/actuator/health/liveness | grep '"status":"UP"'
          curl --fail --silent http://localhost:8081/actuator/health/readiness | grep '"status":"UP"'
          curl --fail --silent http://localhost:8081/weddings > /dev/null
          curl --fail --silent http://localhost:8081/celebrations-of-life > /dev/null
          curl --fail --silent --head http://localhost:8081/ | grep -i '^Content-Security-Policy:'
          curl --fail --silent --head http://localhost:8081/ | grep -i '^X-Content-Type-Options: nosniff'

      - name: Install the ChromeDriver matching the runner browser
        shell: bash
        run: |
          chrome_major="$(google-chrome --product-version | cut -d. -f1)"
          npx --yes browser-driver-manager install "chrome@${chrome_major}"
          driver_path="$(find "$HOME/.browser-driver-manager/chromedriver" -type f -name chromedriver -print | sort | tail -n 1)"
          if [ -z "$driver_path" ]; then
            echo "A matching ChromeDriver could not be located." >&2
            exit 1
          fi
          echo "AXE_CHROMEDRIVER_PATH=$driver_path" >> "$GITHUB_ENV"

      - name: Run automated accessibility checks
        run: >-
          npx --yes @axe-core/cli@4.13.0
          http://localhost:8081/
          http://localhost:8081/weddings
          http://localhost:8081/naming-ceremonies
          http://localhost:8081/vow-renewals
          http://localhost:8081/celebrations-of-life
          http://localhost:8081/reviews
          --chromedriver-path "$AXE_CHROMEDRIVER_PATH"
          --exit

      - name: Upload application log after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: application.log
