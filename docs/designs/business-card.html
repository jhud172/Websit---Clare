<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Business Card - Clare's Life Celebrations</title>
    <link rel="stylesheet" href="shared-print.css">
    <style>
        @page {
            size: 85mm 55mm;
            margin: 0;
        }
    </style>
</head>
<body class="business-card">
    <section class="print-page card-page card-front" aria-label="Business card front">
        <img class="feather feather-left" src="../../src/main/resources/static/images/objects/feather-horizontal.png" alt="">
        <img class="feather feather-right" src="../../src/main/resources/static/images/objects/feather-horizontal-mirrored.png" alt="">
        <span class="card-orbit card-orbit-one" aria-hidden="true"></span>
        <span class="card-orbit card-orbit-two" aria-hidden="true"></span>
        <div class="card-front-inner">
            <img class="logo" src="../../src/main/resources/static/images/brand/logo-clare-no-background.png" alt="Clare's Life Celebrations logo">
            <div class="divider"></div>
            <h1>Clare's Life Celebrations</h1>
            <p>For moments that matter</p>
        </div>
    </section>

    <section class="print-page card-page card-back" aria-label="Business card back">
        <img class="feather feather-back-main" src="../../src/main/resources/static/images/objects/feather-vertical.png" alt="">
        <img class="feather feather-back-sweep" src="../../src/main/resources/static/images/objects/feather-horizontal.png" alt="">
        <span class="card-orbit card-back-orbit" aria-hidden="true"></span>
        <div class="card-back-logo">
            <img class="logo" src="../../src/main/resources/static/images/brand/logo-clare-CLC.png" alt="CLC wreath logo">
            <p>Celebrant for weddings, funerals and life moments</p>
        </div>
        <div class="card-back-details">
            <div>
                <p class="eyebrow">Contact Clare</p>
                <h2>Warm, personal ceremonies across the North East.</h2>
            </div>
            <div class="contact-list">
                <p class="contact-row">
                    <span class="contact-icon contact-icon-gmail" aria-hidden="true"><img src="assets/gmail.svg" alt=""></span>
                    <span>clarebruntoncelebrant@gmail.com</span>
                </p>
                <p class="contact-row">
                    <span class="contact-icon contact-icon-whatsapp" aria-hidden="true"><img src="assets/whatsapp.svg" alt=""></span>
                    <span>07885 428304</span>
                </p>
                <p class="contact-row">
                    <span class="contact-icon contact-icon-clc" aria-hidden="true"><img src="../../src/main/resources/static/images/brand/logo-clare-CLC.png" alt=""></span>
                    <span>clarebruntonlifeceremonies.com</span>
                </p>
                <p class="contact-row">
                    <span class="contact-icon contact-icon-instagram" aria-hidden="true"><img src="assets/instagram.svg" alt=""></span>
                    <span>@clareslifecelebrations</span>
                </p>
            </div>
        </div>
    </section>
</body>
</html>
