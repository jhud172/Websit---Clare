<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A5 Front Cover - Clare's Life Celebrations</title>
    <link rel="stylesheet" href="shared-print.css">
    <style>
        @page {
            size: A5 portrait;
            margin: 0;
        }
    </style>
</head>
<body class="front-cover-design">
    <main class="print-page front-cover-page" aria-label="A5 front cover">
        <img class="front-cover-feather front-cover-feather-top" src="../../src/main/resources/static/images/objects/feather-horizontal-mirrored.png" alt="">
        <img class="front-cover-feather front-cover-feather-left" src="../../src/main/resources/static/images/objects/feather-vertical.png" alt="">
        <img class="front-cover-feather front-cover-feather-right" src="../../src/main/resources/static/images/objects/feather-vertical.png" alt="">
        <img class="front-cover-feather front-cover-feather-bottom" src="../../src/main/resources/static/images/objects/feather-horizontal.png" alt="">
        <img class="front-cover-feather front-cover-feather-extra" src="../../src/main/resources/static/images/objects/feather-horizontal.png" alt="">

        <span class="front-cover-orbit front-cover-orbit-one" aria-hidden="true"></span>
        <span class="front-cover-orbit front-cover-orbit-two" aria-hidden="true"></span>
        <span class="front-cover-orbit front-cover-orbit-three" aria-hidden="true"></span>

        <section class="front-cover-panel">
            <p class="front-cover-name">Clare Brunton</p>
            <div class="front-cover-brand">
                <img class="front-cover-logo" src="../../src/main/resources/static/images/brand/CLC + Wreath Logo.png" alt="CLC wreath logo">
                <div class="front-cover-brand-text">
                    <h1>Clare's Life Celebrations</h1>
                    <p class="front-cover-tagline">For moments that matter</p>
                </div>
            </div>
            <span class="front-cover-divider" aria-hidden="true"></span>
            <p class="front-cover-role">Independent celebrant for weddings, funerals and life moments</p>
        </section>
    </main>
</body>
</html>
