<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A5 Business Card Style - Clare's Life Celebrations</title>
    <link rel="stylesheet" href="shared-print.css">
    <style>
        @page {
            size: A5 landscape;
            margin: 0;
        }
    </style>
</head>
<body class="a5-card-design">
    <section class="print-page a5-card-page a5-card-front" aria-label="A5 business card style front">
        <img class="feather a5-feather a5-feather-front-left" src="../../src/main/resources/static/images/objects/feather-horizontal.png" alt="">
        <img class="feather a5-feather a5-feather-front-right" src="../../src/main/resources/static/images/objects/feather-horizontal-mirrored.png" alt="">
        <img class="feather a5-feather a5-feather-front-top" src="../../src/main/resources/static/images/objects/feather-vertical.png" alt="">
        <img class="feather a5-feather a5-feather-front-bottom" src="../../src/main/resources/static/images/objects/feather-horizontal.png" alt="">
        <span class="card-orbit a5-orbit a5-orbit-one" aria-hidden="true"></span>
        <span class="card-orbit a5-orbit a5-orbit-two" aria-hidden="true"></span>
        <span class="card-orbit a5-orbit a5-orbit-three" aria-hidden="true"></span>

        <div class="a5-card-front-inner">
            <img class="logo" src="../../src/main/resources/static/images/brand/logo-clare-no-background.png" alt="Clare's Life Celebrations logo">
            <div class="divider"></div>
            <h1>Clare's Life Celebrations</h1>
            <p>For moments that matter</p>
        </div>
    </section>

    <section class="print-page a5-card-page a5-card-back" aria-label="A5 business card style back">
        <img class="feather a5-feather a5-feather-back-main" src="../../src/main/resources/static/images/objects/feather-vertical.png" alt="">
        <img class="feather a5-feather a5-feather-back-left" src="../../src/main/resources/static/images/objects/feather-horizontal.png" alt="">
        <img class="feather a5-feather a5-feather-back-right" src="../../src/main/resources/static/images/objects/feather-horizontal-mirrored.png" alt="">
        <img class="feather a5-feather a5-feather-back-bottom" src="../../src/main/resources/static/images/objects/feather-horizontal.png" alt="">
        <img class="feather a5-feather a5-feather-back-top" src="../../src/main/resources/static/images/objects/feather-vertical.png" alt="">
        <span class="card-orbit a5-orbit a5-back-orbit-one" aria-hidden="true"></span>
        <span class="card-orbit a5-orbit a5-back-orbit-two" aria-hidden="true"></span>

        <div class="a5-card-back-logo">
            <img class="logo" src="../../src/main/resources/static/images/brand/logo-clare-CLC.png" alt="CLC wreath logo">
            <p>Independent celebrant for weddings, funerals and life moments</p>
        </div>

        <div class="a5-card-back-details">
            <div>
                <p class="eyebrow">Contact Clare</p>
                <h2>Warm, personal ceremonies across the North East.</h2>
            </div>
            <div class="contact-list">
                <p class="contact-row">
                    <span class="contact-icon contact-icon-gmail" aria-hidden="true"><img src="assets/gmail.svg" alt=""></span>
                    <span>clarebruntoncelebrant@gmail.com</span>
                </p>
                <p class="contact-row">
                    <span class="contact-icon contact-icon-whatsapp" aria-hidden="true"><img src="assets/whatsapp.svg" alt=""></span>
                    <span>07885 428304</span>
                </p>
                <p class="contact-row">
                    <span class="contact-icon contact-icon-clc" aria-hidden="true"><img src="../../src/main/resources/static/images/brand/logo-clare-CLC.png" alt=""></span>
                    <span>clareslifecelebrations.com</span>
                </p>
                <p class="contact-row">
                    <span class="contact-icon contact-icon-instagram" aria-hidden="true"><img src="assets/instagram.svg" alt=""></span>
                    <span>@clareslifecelebrations</span>
                </p>
            </div>
        </div>
    </section>
</body>
</html>
