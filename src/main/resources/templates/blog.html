<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${pageTitle}, ${pageDescription}, 'blog', ~{::main})}">
<main class="theme-journal">
    <section class="page-hero">
        <div class="shell page-hero-inner">
            <div>
                <p class="eyebrow">Journal</p>
                <h1>Notes on ceremony, meaning and moments that matter.</h1>
            </div>
            <p class="lead">Reflections and practical guidance for couples, families and anyone planning a ceremony with warmth, dignity and individuality.</p>
        </div>
    </section>

    <section class="section">
        <div class="shell article-stack">
            <article class="article-row" th:each="post : ${posts}">
                <div class="article-column">
                    <p class="article-meta">
                        <span th:text="${post.category()}">Planning</span>
                        <span th:text="${post.publishedOn()}">May 2026</span>
                    </p>
                    <h2 th:text="${post.title()}">Questions to ask before booking a celebrant</h2>
                </div>
                <div class="article-column">
                    <p th:text="${post.excerpt()}">Placeholder excerpt.</p>
                    <a class="text-link" th:href="@{/blog/{slug}(slug=${post.slug()})}">Open article</a>
                </div>
            </article>
        </div>
    </section>
</main>
</html>
