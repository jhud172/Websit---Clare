<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${pageTitle}, ${pageDescription}, 'reviews', ~{::main})}">
<main class="theme-trust secondary-page reviews-admin-page">
    <section class="secondary-hero admin-login-hero section-reveal-zone">
        <div class="shell secondary-hero-grid">
            <div class="secondary-hero-copy">
                <p class="eyebrow">Clare Dashboard</p>
                <h1>Sign in securely.</h1>
                <p class="lead">Manage saved enquiries, booking progress, reviews and aggregate website activity.</p>
            </div>
            <form class="secondary-login-form" th:action="@{/reviews/admin/login}" method="post">
                <p class="field-error" th:if="${reviewAdminError != null}" th:text="${reviewAdminError}">Login error</p>
                <p class="callout" th:if="${reviewAdminMessage != null}" th:text="${reviewAdminMessage}">Signed out.</p>
                <div class="field-group">
                    <label for="username">Username</label>
                    <div class="field-control">
                        <input id="username" name="username" type="text" autocomplete="username" required>
                    </div>
                </div>
                <div class="field-group">
                    <label for="password">Password</label>
                    <div class="field-control">
                        <input id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                </div>
                <button class="button" type="submit">Sign in</button>
            </form>
        </div>
    </section>
</main>
</html>
