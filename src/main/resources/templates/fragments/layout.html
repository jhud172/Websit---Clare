<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="page(pageTitle, pageDescription, activePage, mainContent)">
<head>
    <th:block th:replace="~{fragments/metadata :: page-metadata(${pageTitle}, ${pageDescription})}"></th:block>
    <th:block th:replace="~{base :: asset-imports(${activePage})}"></th:block>
</head>
<body>
<div class="atmospheric-feather-field" aria-hidden="true">
    <span class="atmospheric-feather atmospheric-feather-one"></span>
    <span class="atmospheric-feather atmospheric-feather-two"></span>
    <span class="atmospheric-feather atmospheric-feather-three"></span>
    <span class="atmospheric-feather atmospheric-feather-four"></span>
    <span class="atmospheric-feather atmospheric-feather-five"></span>
    <span class="atmospheric-feather atmospheric-feather-six"></span>
</div>
<div th:replace="~{fragments/header :: site-header(${activePage})}"></div>
<span id="main-content" class="main-content-anchor" tabindex="-1">
    <span class="sr-only">Main content begins here</span>
</span>
<th:block th:replace="${mainContent}"></th:block>
<th:block th:replace="~{fragments/enquiry-modal :: enquiry-modal}"></th:block>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
