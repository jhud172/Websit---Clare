<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" data-site-header th:fragment="site-header(activePage)">
    <div class="shell header-inner">
        <a class="brand" th:href="@{/}" aria-label="Go to the home page">
            <span class="brand-lockup">
                <span class="logo-composite brand-logo-composite" aria-hidden="true">
                    <img class="logo-layer logo-clc"
                         th:src="@{${clcLogoPath}}"
                         alt="">
                    <img class="logo-layer logo-wreath"
                         th:src="@{${wreathLogoPath}}"
                         alt="">
                </span>
                <span class="sr-only">Clare's Life Celebrations logo</span>
            </span>
            <span class="brand-wording">
                <span class="brand-name" th:text="${site.name}">Clare's Life Celebrations</span>
                <span class="brand-tagline" th:text="${site.tagline}">For Moments That Matter</span>
            </span>
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Toggle navigation menu" data-nav-toggle>
            <span class="sr-only">Toggle menu</span>
            <span class="hamburger" aria-hidden="true">
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
            </span>
        </button>

        <nav class="site-nav" id="site-navigation" data-site-nav>
            <a th:href="@{/}" th:classappend="${activePage == 'home'} ? ' is-active'">Home</a>
            <a th:href="@{/about}" th:classappend="${activePage == 'about'} ? ' is-active'">About</a>
            <a th:href="@{/services}" th:classappend="${activePage == 'services'} ? ' is-active'">Services</a>
            <a th:href="@{/weddings}" th:classappend="${activePage == 'weddings'} ? ' is-active'">Weddings</a>
            <a th:href="@{/celebrations-of-life}" th:classappend="${activePage == 'celebrations-of-life'} ? ' is-active'">Celebrations of Life</a>
            <a th:href="@{/faq}" th:classappend="${activePage == 'faq'} ? ' is-active'">FAQ</a>
            <a th:href="@{/reviews}" th:classappend="${activePage == 'reviews'} ? ' is-active'">Reviews</a>
        </nav>

        <div class="header-actions">
            <button class="button button-peacock header-cta" type="button" data-open-enquiry-modal>
                <span class="header-cta-label">Make an enquiry</span>
                <span class="header-cta-sub">Tell Clare about your ceremony</span>
                <span class="feather left"></span>
                <span class="feather right"></span>
            </button>
        </div>
    </div>
</header>
</body>
</html>
