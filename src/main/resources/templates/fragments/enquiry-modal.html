<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="enquiry-modal" th:fragment="enquiry-modal" data-enquiry-modal hidden>
    <div class="enquiry-modal-backdrop" data-enquiry-modal-close></div>
    <div class="enquiry-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="enquiry-modal-title" tabindex="-1" data-enquiry-modal-dialog>
        <button class="enquiry-modal-close" type="button" aria-label="Close enquiry form" data-enquiry-modal-close>
            <span aria-hidden="true">×</span>
        </button>
        <div class="enquiry-modal-header">
            <p class="eyebrow">Make an enquiry</p>
            <h2 id="enquiry-modal-title">Tell Clare about your ceremony</h2>
            <p>A warm, personal response will follow. Share a few details and Clare will guide the next steps clearly.</p>
        </div>

        <form class="contact-form enquiry-modal-form"
              data-contact-form
              th:action="@{/contact}"
              th:object="${inquiryForm}"
              method="post"
              enctype="multipart/form-data"
              novalidate>
            <div class="field-group" data-form-field="fullName">
                <label for="fullName">Full name</label>
                <div class="field-control" th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid'">
                    <input id="fullName" type="text" th:field="*{fullName}" placeholder="Your full name" autocomplete="name">
                </div>
                <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Full name error</p>
            </div>

            <div class="field-row">
                <div class="field-group" data-form-field="email">
                    <label for="email">Email</label>
                    <div class="field-control" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
                        <input id="email" type="email" th:field="*{email}" placeholder="you@example.com" autocomplete="email">
                    </div>
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
                </div>
                <div class="field-group" data-form-field="phone">
                    <label for="phone">Phone</label>
                    <div class="field-control" th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'">
                        <input id="phone" type="tel" th:field="*{phone}" placeholder="Your phone number" autocomplete="tel">
                    </div>
                    <p class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</p>
                </div>
            </div>

            <div class="field-row">
                <div class="field-group" data-form-field="serviceType">
                    <label for="serviceType">Ceremony type</label>
                    <div class="field-control" th:classappend="${#fields.hasErrors('serviceType')} ? ' is-invalid'">
                        <select id="serviceType" th:field="*{serviceType}">
                            <option value="">Select a ceremony type</option>
                            <option th:each="option : ${serviceOptions}" th:value="${option}" th:text="${option}">Wedding ceremony</option>
                        </select>
                    </div>
                    <p class="field-error" th:if="${#fields.hasErrors('serviceType')}" th:errors="*{serviceType}">Service type error</p>
                </div>
                <div class="field-group" data-form-field="eventDate">
                    <label for="eventDate">Preferred date</label>
                    <div class="field-control" th:classappend="${#fields.hasErrors('eventDate')} ? ' is-invalid'">
                        <input id="eventDate" type="date" th:field="*{eventDate}">
                    </div>
                    <p class="field-error" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}">Date error</p>
                </div>
            </div>

            <div class="field-group" data-form-field="venue">
                <label for="venue">Venue or location</label>
                <div class="field-control" th:classappend="${#fields.hasErrors('venue')} ? ' is-invalid'">
                    <input id="venue" type="text" th:field="*{venue}" placeholder="Venue, town or location">
                </div>
                <p class="field-error" th:if="${#fields.hasErrors('venue')}" th:errors="*{venue}">Venue error</p>
            </div>

            <div class="field-group" data-form-field="message">
                <label for="message">Tell Clare a little more</label>
                <div class="field-control field-control-textarea" th:classappend="${#fields.hasErrors('message')} ? ' is-invalid'">
                    <textarea id="message" th:field="*{message}" rows="6" placeholder="Share the kind of ceremony you are planning, and anything Clare should know."></textarea>
                </div>
                <p class="field-error" th:if="${#fields.hasErrors('message')}" th:errors="*{message}">Message error</p>
            </div>

            <div class="field-group">
                <label for="attachments">Optional files (up to 3, max 5MB each)</label>
                <div class="field-control">
                    <input id="attachments" name="attachments" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf" multiple>
                </div>
                <p class="field-error" th:if="${attachmentError != null}" th:text="${attachmentError}">Attachment error</p>
            </div>

            <div class="checkbox-row" data-form-field="privacyAccepted" th:classappend="${#fields.hasErrors('privacyAccepted')} ? ' is-invalid'">
                <input class="checkbox-input" id="privacyAccepted" type="checkbox" th:field="*{privacyAccepted}">
                <label class="checkbox-label" for="privacyAccepted">
                    <span class="checkbox-box" aria-hidden="true"></span>
                    <span>I am happy for my details to be used so Clare can respond to this enquiry in line with the <a class="text-link" th:href="@{/privacy}">privacy notice</a>.</span>
                </label>
            </div>
            <p class="field-error" th:if="${#fields.hasErrors('privacyAccepted')}" th:errors="*{privacyAccepted}">Privacy error</p>

            <button class="button" type="submit">Send enquiry</button>
        </form>
    </div>
</div>
</body>
</html>
