<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="asset-imports(activePage)">
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="shortcut icon" th:href="@{/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/images/brand/clc-wreath-logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link th:if="${activePage == 'home'}" rel="preload" as="image" th:href="@{/images/clare/weddings-confetti.jpg}" fetchpriority="high">
    <link th:if="${activePage == 'weddings'}" rel="preload" as="image" th:href="@{/images/weddings/amy-wedding-1.jpg}" fetchpriority="high">
    <link th:if="${activePage == 'celebrations-of-life'}" rel="preload" as="image" th:href="@{/images/funerals/memorial-flowers-soft.jpg}" fetchpriority="high">
    <link th:if="${activePage == 'about'}" rel="preload" as="image" th:href="@{/images/clare/clare-folder-portrait.jpg}" fetchpriority="high">
    <link th:if="${activePage == 'services'}" rel="preload" as="image" th:href="@{/images/weddings/home-hero.jpg}" fetchpriority="high">
    <link th:if="${activePage == 'reviews'}" rel="preload" as="image" th:href="@{/images/clare/weddings-confetti.jpg}" fetchpriority="high">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css(v='20260531b')}">
    <script defer th:src="@{/js/site.js(v='20260531b')}"></script>
</th:block>
</html>
