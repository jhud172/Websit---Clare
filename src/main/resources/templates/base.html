<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="asset-imports(activePage)">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32.png}">
    <link rel="icon" type="image/png" sizes="48x48" th:href="@{/favicon-48.png}">
    <link rel="shortcut icon" th:href="@{/favicon-48.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="preload" th:href="@{/fonts/manrope-latin.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" th:href="@{/fonts/cormorant-garamond-latin.woff2}" as="font" type="font/woff2" crossorigin>
    <link th:if="${activePage == 'home'}" rel="preload" as="image" th:href="@{/images/clare/weddings-confetti.jpg}" fetchpriority="high">
    <link th:if="${activePage == 'weddings'}" rel="preload" as="image" th:href="@{/images/weddings/amy-wedding-2.jpg}" fetchpriority="high">
    <link th:if="${activePage == 'celebrations-of-life'}" rel="preload" as="image" th:href="@{/images/funerals/memorial-flowers-soft.jpg}" fetchpriority="high">
    <link th:if="${activePage == 'about'}" rel="preload" as="image" th:href="@{/images/clare/clare-folder-portrait.jpg}" fetchpriority="high">
    <link th:if="${activePage == 'services'}" rel="preload" as="image" th:href="@{/images/weddings/home-hero.jpg}" fetchpriority="high">
    <link th:if="${activePage == 'reviews'}" rel="preload" as="image" th:href="@{/images/clare/weddings-confetti.jpg}" fetchpriority="high">
    <link rel="stylesheet" th:href="@{/css/site.css(v='20260810b')}">
    <script defer th:src="@{/js/site.js(v='20260803y')}"></script>
</th:block>
</html>
