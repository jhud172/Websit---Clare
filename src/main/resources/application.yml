server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: clare-ceremonies-site
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

site:
  name: ${SITE_NAME:Clare's Life Celebrations}
  tagline: ${SITE_TAGLINE:For Moments That Matter}
  contact-email: ${SITE_CONTACT_EMAIL:clarebruntoncelebrant@gmail.com}
  phone-number: ${SITE_PHONE_NUMBER:07885 428304}
  instagram-url: ${SITE_INSTAGRAM_URL:https://www.instagram.com/clareslifecelebrations/}
  base-url: ${SITE_BASE_URL:http://localhost:8080}
  from-email: ${SITE_FROM_EMAIL:}

inquiry:
  notification-email: ${INQUIRY_NOTIFICATION_EMAIL:${SITE_CONTACT_EMAIL:hello@clarebrunton.co.uk}}
  fallback-directory: ${INQUIRY_FALLBACK_DIRECTORY:data/inquiries}

email:
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:${SITE_FROM_EMAIL:}}

reviews:
  storage-directory: ${REVIEWS_STORAGE_DIRECTORY:data/reviews}
  photo-directory: ${REVIEWS_PHOTO_DIRECTORY:uploads}
  admin-username: ${REVIEWS_ADMIN_USERNAME:admin}
  admin-password: ${REVIEWS_ADMIN_PASSWORD:password}
  max-photo-count: ${REVIEWS_MAX_PHOTO_COUNT:10}
  max-photo-size-bytes: ${REVIEWS_MAX_PHOTO_SIZE_BYTES:5242880}
  notification-email: ${REVIEWS_NOTIFICATION_EMAIL:${INQUIRY_NOTIFICATION_EMAIL:${SITE_CONTACT_EMAIL:clarebruntoncelebrant@gmail.com}}}
